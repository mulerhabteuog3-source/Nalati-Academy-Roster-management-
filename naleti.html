:root{--bg:#fbfaf6;--card:#fff;--ink:#1c2420;--mut:#5d6a63;--g:#1f4d3a;--g2:#e3efe8;--o:#d9a441;--r:#b5472f;--line:#dfe3dc;--ok:#2f7d57}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121a16;--card:#1a2520;--ink:#eef2ee;--mut:#9bab9f;--g:#7cc4a0;--g2:#22362c;--line:#2d3d34;--r:#e08a74;--ok:#7cc4a0}}
:root[data-theme=dark]{--bg:#121a16;--card:#1a2520;--ink:#eef2ee;--mut:#9bab9f;--g:#7cc4a0;--g2:#22362c;--line:#2d3d34;--r:#e08a74;--ok:#7cc4a0}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans Ethiopic","Nyala","Abyssinica SIL",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:14px}
h1,h2,h3{margin:0;font-family:Georgia,"Noto Sans Ethiopic",serif}
h2{font-size:18px;margin-bottom:8px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:3px solid var(--o);padding-bottom:10px;margin-bottom:12px}
header h1{font-size:21px;color:var(--g)}
select,input,textarea,button{font:inherit;color:inherit}
select,input,textarea{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%}
textarea{min-height:70px}
button{background:var(--g);color:var(--bg);border:0;border-radius:6px;padding:9px 14px;font-weight:700;cursor:pointer}
button.ghost{background:none;color:var(--g);border:1px solid var(--g)}
button.red{background:var(--r);color:#fff}
button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--o);outline-offset:2px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
nav button{background:var(--g2);color:var(--g);white-space:nowrap}
nav button.on{background:var(--g);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.row>*{flex:1 1 120px}
.row .fix,.fix{flex:0 0 auto}
.li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.mut{color:var(--mut);font-size:14px}
.pill{border-radius:99px;padding:2px 10px;font-size:13px;background:var(--g2);color:var(--g);white-space:nowrap}
.pill.bad{background:#f6ddd6;color:#8a2f1c}
.pill.ok{background:#d9efe2;color:#17563a}
.st{min-width:96px}
.sP{background:var(--ok);color:#fff}.sA{background:var(--r);color:#fff}.sL{background:var(--o);color:#1c2420}.s0{background:none;color:var(--mut);border:1px dashed var(--line)}
.bar{height:10px;background:var(--g2);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--o)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.ct th,.ct td{border:1px solid var(--line);padding:4px 6px;font-size:13px;text-align:left}
.ct th{background:var(--g2);color:var(--ink)}
.tt{table-layout:fixed}.tt th,.tt td{border:1px solid var(--line);padding:3px 1px;font-size:11px;text-align:center;vertical-align:top;overflow-wrap:anywhere}.tt th:first-child{width:50px}.tt td{height:46px}
.tt th{background:var(--g2)}
.tt td.off{background:repeating-linear-gradient(45deg,var(--g2),var(--g2) 4px,transparent 4px,transparent 8px)}
.tt td.cl{background:#f6ddd6;color:#8a2f1c}
.tt td[onclick]{cursor:pointer}
.rc{border:1px solid var(--line);padding:12px;margin-bottom:10px}
.rch{text-align:center;margin-bottom:8px}
.sig{display:flex;justify-content:space-between;margin-top:34px;font-size:13px}
.sig span{border-top:1px solid currentColor;padding-top:4px;min-width:28%;text-align:center}
.warn{color:var(--r)}
a{color:var(--g);font-weight:700}
#print{display:none}
@page{size:A4;margin:12mm}
@media print{
 body>.wrap{display:none}
 #print{display:block}
 body{background:#fff;color:#000}
 #print *{color:#000!important;background:none!important}
 .rc{border:0;page-break-after:always}
 .ct th,.ct td{border:1px solid #444!important}
 .tt th,.tt td{border:1px solid #444!important}
}
</style>

function attStat(a,id,pre){let p=0,ab=0,l=0;for(const d in a){if(pre&&!d.startsWith(pre))continue;const v=a[d][id];if(v==="P")p++;else if(v==="A")ab++;else if(v==="L")l++}const n=p+ab+l;return{P:p,A:ab,L:l,n,rate:n?Math.round((p+l)/n*100):null}}
function ymdAdd(ymd,days){const d=new Date(ymd+"T12:00:00");d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)}
function weekMon(ymd){const d=new Date(ymd+"T12:00:00"),wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return d.toISOString().slice(0,10)}
function attRange(a,id,from,to){let p=0,ab=0,l=0,n=0;const days=[];for(let x=from;x<=to;x=ymdAdd(x,1)){const v=(a[x]||{})[id];days.push({d:x,v:v||""});if(v==="P"){p++;n++}else if(v==="A"){ab++;n++}else if(v==="L"){l++;n++}}return{P:p,A:ab,L:l,n,rate:n?Math.round((p+l)/n*100):null,days}}
function statusLab(v){return v==="P"?t("present"):v==="A"?t("absent"):v==="L"?t("late"):"—"}
function tm(sid,ti){const m=(S.mk[sid]||{})[ti]||{};let s=0,n=0;for(const j of subs()){const tot=mkTotal(m[j]);if(tot!=null){s+=tot;n++}}return{sum:s,n,avg:n?s/n:null}}
function rankOf(sid,ti){
 if(S.rank&&S.rank[ti])return S.rank[ti];
 const st=S.stu.find(x=>x.id===sid);if(!st)return null;const me=tm(sid,ti).avg;if(me==null)return null;
 const cls=S.stu.filter(x=>x.grade===st.grade&&x.prog===st.prog).map(x=>tm(x.id,ti).avg).filter(x=>x!=null);
 return{r:1+cls.filter(x=>x>me+1e-9).length,n:cls.length};
}

function teacherSubs(){
 if(!U||U.role==="admin")return subs().slice();
 if(U.role!=="teacher")return [];
 const me=S.staff.find(x=>x.id===U.id);
 if(!me||!me.subj)return [];

 // match comma-separated subject names (case-insensitive, partial ok)
 return me.subj.split(/[,;/|]+/).map(s=>s.trim()).filter(Boolean).map(s=>{
  const hit=all.find(x=>x.toLowerCase()===s.toLowerCase())||all.find(x=>x.toLowerCase().includes(s.toLowerCase())||s.toLowerCase().includes(x.toLowerCase()));
  return hit||s;
 }).filter((v,i,a)=>a.indexOf(v)===i);

function parseCSV(text){return String(text||"").replace(/^\ufeff/,"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean).slice(1).map(l=>{const out=[];let cur="",q=false;for(let i=0;i<l.length;i++){const c=l[i];if(c==='"'){if(q&&l[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===","&&!q){out.push(cur.trim());cur=""}else cur+=c}out.push(cur.trim());return out})}

function readCsvFile(inp,cb){const f=inp&&inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{cb(parseCSV(r.result))}catch(x){msg=t("badfile");draw()}};r.onerror=()=>{msg=t("badfile");draw()};r.readAsText(f)}

async function uploadBookFile(inp){
 const f=inp&&inp.files&&inp.files[0];if(!f)return;
 const title=(val("btitle")||f.name.replace(/\.[^.]+$/,"")).trim();
 const author=val("bauthor")||"";
 const copies=Math.max(1,+val("bcopies")||1);
 const ext=(f.name.split(".").pop()||"").toLowerCase();
 if(!["pdf","doc","docx"].includes(ext)){msg="Use PDF or Word (.pdf, .doc, .docx)";return draw()}
 if(f.size>8*1024*1024){msg="File too large (max 8 MB)";return draw()}
 if(!title){msg=t("req");return draw()}
 msg="Uploading…";draw();
 try{
  const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const s=String(r.result||"");const i=s.indexOf(",");res(i>=0?s.slice(i+1):s)};r.onerror=rej;r.readAsDataURL(f)});
  if(MODE==="server"){
   await api("POST","/books",{title,author,copies,filename:f.name,mime:f.type||"",data});
   await loadState();
  }else{
   // local: metadata only + note (file not stored offline)
   S.lib.push({id:nextId(S.lib,"B"),title,author,copies,filename:f.name,mime:f.type||"",file:""});
   await savec("lib");
   msg=t("saved")+" (file name saved; open PDF online on https server)";draw();return;
  }
  msg=t("saved")+": "+title;draw();
 }catch(x){msg=t("badfile")+(x?": "+x:"");draw()}
}

 });

/* ---------- biometrics (WebAuthn – device fingerprint) ---------- */
function bioSupported(){try{return !!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext)}catch(_){return false}}
function bioIsFile(){return location.protocol==="file:"}
function b64url(buf){const u=new Uint8Array(buf);let s="";for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function fromB64url(s){s=s.replace(/-/g,"+").replace(/_/g,"/");const pad="=".repeat((4-s.length%4)%4);const bin=atob(s+pad);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer}
function bioKey(){return "naleti-bio-"+(U&&U.id?U.id:"x")}
function bioRp(){const o={name:"Naleti Academy"};const h=location.hostname;if(h&&h!=="localhost"&&location.protocol!=="file:")o.id=h;return o}
function bioErrMsg(err){const m=(err&&(err.message||err.name))||"";return t("bioFail")+(m?" — "+m:"")}
async function bioEnroll(){
 if(bioIsFile()){msg=t("bioFile");return draw()}
 if(!bioSupported()){msg=t("bioNo");return draw()}
 try{
  const chal=crypto.getRandomValues(new Uint8Array(32));
  const userId=new TextEncoder().encode(String(U.id));
  const cred=await navigator.credentials.create({publicKey:{
   challenge:chal,rp:bioRp(),
   user:{id:userId,name:String(U.id),displayName:String(U.name||U.id)},
   pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
   authenticatorSelection:{userVerification:"required"},
   timeout:90000
  }});
  if(!cred){msg=t("bioFail");return draw()}
  try{localStorage.setItem(bioKey(),b64url(cred.rawId))}catch(_){}
  BIO_OK=true;msg=t("bioOk");draw();
 }catch(err){msg=bioErrMsg(err);draw()}
}
async function bioUnlock(){
 if(bioIsFile()){msg=t("bioFile");return draw()}
 if(!bioSupported()){msg=t("bioNo");return draw()}
 const raw=(()=>{try{return localStorage.getItem(bioKey())}catch(_){return null}})();
 if(!raw){return bioEnroll()}
 try{
  const chal=crypto.getRandomValues(new Uint8Array(32));
  const opt={challenge:chal,timeout:90000,userVerification:"required",allowCredentials:[{type:"public-key",id:fromB64url(raw)}]};
  const cred=await navigator.credentials.get({publicKey:opt});
  if(!cred){msg=t("bioFail");return draw()}
  BIO_OK=true;msg=t("bioOk");draw();
 }catch(err){msg=bioErrMsg(err);draw()}
}
function bioLock(){BIO_OK=false;msg="";draw()}

 if(bioIsFile()){msg=t("bioFile");return draw()}
 if(!bioSupported()){msg=t("bioNo");return draw()}
 const st=S.stu.find(x=>x.id===sid);if(!st){msg=t("none");return draw()}
 try{
  const chal=crypto.getRandomValues(new Uint8Array(32));
  const userId=new TextEncoder().encode("stu-"+sid+"-"+Date.now());
  const cred=await navigator.credentials.create({publicKey:{
   challenge:chal,rp:bioRp(),
   user:{id:userId,name:sid,displayName:String(st.name||sid)},
   pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
   authenticatorSelection:{userVerification:"required"},
   timeout:90000
  }});
  if(!cred){msg=t("bioFail");return draw()}
  if(!S.bio)S.bio={};
  S.bio[sid]=b64url(cred.rawId);

   challenge:chal,timeout:90000,userVerification:"required",

/* ---------- school compound geolocation (+ APK mock-GPS block) ---------- */
function isNativeApp(){
 try{
  if(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())return true;
  if(window.NaletiGeo&&typeof NaletiGeo.getVerifiedLocation==="function")return true;
 }catch(_){}
 return false;
}
function geoEnabled(){return !!(S.cfg&&S.cfg.geoOn&&S.cfg.geoLat!=null&&S.cfg.geoLng!=null)}
function haversineM(lat1,lng1,lat2,lng2){
 const R=6371000,toR=x=>x*Math.PI/180;
 const dLat=toR(lat2-lat1),dLng=toR(lng2-lng1);
 const a=Math.sin(dLat/2)**2+Math.cos(toR(lat1))*Math.cos(toR(lat2))*Math.sin(dLng/2)**2;
 return 2*R*Math.asin(Math.min(1,Math.sqrt(a)));
}
function inAttendanceWindow(){
 if(!S.cfg.geoWinOn)return true;
 const now=new Date();
 const hh=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
 const a=S.cfg.geoWinFrom||"07:00",b=S.cfg.geoWinTo||"17:00";
 if(a<=b)return hh>=a&&hh<=b;
 return hh>=a||hh<=b;
}
function getPositionBrowser(){
 return new Promise((resolve,reject)=>{
  if(!navigator.geolocation)return reject("no");
  navigator.geolocation.getCurrentPosition(
   p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,mock:false,source:"web"}),
   e=>reject(e&&e.code===1?"denied":e&&e.code===2?"unavailable":e&&e.code===3?"timeout":"fail"),
   {enableHighAccuracy:true,timeout:20000,maximumAge:5000}
  );
 });
}
async function getPositionNative(){
 // Official APK bridge: window.NaletiGeo.getVerifiedLocation()
 if(window.NaletiGeo&&typeof NaletiGeo.getVerifiedLocation==="function"){
  const r=await Promise.resolve(NaletiGeo.getVerifiedLocation());
  if(!r||r.ok===false){
   if(r&&(r.reason==="mock"||r.mock))throw "mock";
   throw r&&r.reason?r.reason:"fail";
  }
  return {lat:+r.lat,lng:+r.lng,acc:r.acc!=null?+r.acc:null,mock:!!r.mock,source:"native"};
 }
 // Capacitor Geolocation (no mock flag unless custom plugin)
 if(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Geolocation){
  const p=await Capacitor.Plugins.Geolocation.getCurrentPosition({enableHighAccuracy:true,timeout:20000});
  return {lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,mock:false,source:"capacitor"};
 }
 throw "no";
}
async function getPosition(){
 if(isNativeApp()){
  try{return await getPositionNative()}catch(e){if(e==="mock")throw "mock";/* fall through to browser if plugin missing */}
 }
 return getPositionBrowser();
}
async function geoRefresh(){
 GEO={ok:null,lat:null,lng:null,acc:null,dist:null,err:null,mock:false,source:null};
 if(!geoEnabled()){GEO.ok=true;GEO.err="off";return GEO}
 try{
  const pos=await getPosition();
  if(pos.mock){GEO={ok:false,lat:pos.lat,lng:pos.lng,acc:pos.acc,dist:null,err:"mock",mock:true,source:pos.source};return GEO}
  const lat=pos.lat,lng=pos.lng,acc=pos.acc;
  const dist=haversineM(lat,lng,+S.cfg.geoLat,+S.cfg.geoLng);
  const rad=Math.max(30,+S.cfg.geoRad||150);
  const pad=Math.min(acc||0,40);
  GEO={ok:dist<=rad+pad,lat,lng,acc,dist,err:null,mock:false,source:pos.source||"web"};
 }catch(e){
  const err=String(e);
  GEO={ok:false,lat:null,lng:null,acc:null,dist:null,err:err,mock:err==="mock",source:null};
 }
 return GEO;
}
async function geoRequire(){
 if(!inAttendanceWindow()){msg=t("geoWinBlock");draw();return false}
 if(!geoEnabled())return true;
 await geoRefresh();
 if(GEO.err==="mock"||GEO.mock){msg=t("geoMock");draw();return false}
 if(GEO.err==="denied"||GEO.err==="no"||GEO.err==="unavailable"||GEO.err==="timeout"||GEO.err==="fail"){
  msg=t("geoNo");draw();return false;
 }
 if(!GEO.ok){msg=t("geoOut")+(GEO.dist!=null?" ("+Math.round(GEO.dist)+" m)":"");draw();return false}
 return true;
}

async function uploadMk(inp){

  try{
   const rows=parseCSV(r.result);if(!rows.length){msg=t("badfile");return draw()}
   if(!confirm(t("sure")+" ("+rows.length+")"))return;
   const patchF={};let n=0;
   rows.forEach(p=>{
    // StudentID, Name?, Subject, Mid, Final, Activity, Worksheet, Exercise, Neat
    let sid=p[0],subj,mid,fin,act,ws,ex,nt;

 };

}

  const people=isStaff?S.staff.slice().sort(byName):stuBy(G,P);

  }
  if(RAP==="week"){
   const mon=weekMon(RDate||day()),fri=ymdAdd(mon,4);
   const heads=[t("name"),t("d0"),t("d1"),t("d2"),t("d3"),t("d4"),t("present"),t("late"),t("absent"),t("rate")];

    return[s.name,...[0,1,2,3,4].map(i=>statusLab(by[ymdAdd(mon,i)]||"")),a.P,a.L,a.A,a.rate==null?"":a.rate+"%"];
   })};
  }
  const mo=RMo||day().slice(0,7);
  return{title:lab+" — "+t("rmonth")+" "+mo,h:[t("name"),t("present"),t("late"),t("absent"),t("rate")],r:people.map(s=>{const a=attStat(src,s.id,mo);return[s.name,a.P,a.L,a.A,a.rate==null?"":a.rate+"%"]})};
 }
 if(RT==="roster"){const L=S.stu.slice().sort((a,b)=>a.grade-b.grade||String(a.prog).localeCompare(String(b.prog))||byName(a,b));return{title:t("r_roster")+" ("+L.length+")",h:["#","ID",t("name"),t("grade"),t("prog"),t("sex"),t("pn"),t("phone")],r:L.map((s,i)=>[i+1,s.id,s.name,s.grade,t(s.prog),s.sex||"",s.pn||"",s.pp||""])}}
 if(RT==="marks"){return{title:t("r_marks"),h:[t("name"),...subs(),t("total"),t("avg"),t("rank")],r:stuBy(G,P).map(s=>{const m=(S.mk[s.id]||{})[TM]||{},x=tm(s.id,TM),rr=rankOf(s.id,TM);return[s.name,...subs().map(j=>{const tot=typeof mkTotal==="function"?mkTotal(m[j]):(m[j]!=null?m[j]:"");return tot!=null?tot:""}),x.n?r1(x.sum):"",x.n?r1(x.avg):"",rr?rr.r:""]})}}
 if(RT==="fees"){return{title:t("r_fees"),h:[t("name"),t("grade"),t("prog"),t("due"),t("paid"),t("bal")],r:S.stu.map(s=>[s.name,s.grade,t(s.prog),dueOf(s),paidOf(s.id),dueOf(s)-paidOf(s.id)]).sort((a,b)=>b[5]-a[5])}}
 if(RT==="stu"){return{title:t("r_stu"),h:["ID",t("name"),t("grade"),t("prog"),t("sex"),t("pn"),t("phone")],r:S.stu.slice().sort((a,b)=>a.grade-b.grade||a.prog.localeCompare(b.prog)||byName(a,b)).map(s=>[s.id,s.name,s.grade,t(s.prog),s.sex||"",s.pn||"",s.pp||""])}}
 const bt=id=>(S.lib.find(x=>x.id===id)||{title:"?"}).title;
 return{title:t("r_over"),h:[t("booktitle"),t("borrower"),t("duedate")],r:S.loan.filter(l=>!l.ret&&l.due<day()).map(l=>[bt(l.bid),l.who.startsWith("S:")?stuName(l.who.slice(2)):tname(l.who.slice(2)),l.due])};
}

function setS(){
 const th=(()=>{try{return localStorage.getItem("nth")||""}catch(_){return""}})(),adm=U.role==="admin";
 return `<div class="card"><h2>${t("set")}</h2><p class="mut">${e(U.name)} · ${e(U.id)}</p><div class="row">
 <select aria-label="${t("lang")}" onchange="setLang(this.value)"><option value="en"${LG==="en"?" selected":""}>English</option><option value="am"${LG==="am"?" selected":""}>አማርኛ</option><option value="om"${LG==="om"?" selected":""}>Afaan Oromoo</option></select>
 <select aria-label="${t("theme")}" onchange="setTheme(this.value);draw()"><option value=""${th===""?" selected":""}>${t("auto")}</option><option value="light"${th==="light"?" selected":""}>${t("light")}</option><option value="dark"${th==="dark"?" selected":""}>${t("dark")}</option></select></div></div>`+
 (adm?`<div class="card"><h2>${t("school")}</h2><div class="row"><input id="cs1" value="${e(S.cfg.school)}" placeholder="${t("school")}" aria-label="${t("school")}"><input id="cs2" value="${e(S.cfg.year)}" placeholder="${t("year")}" aria-label="${t("year")}"></div>
 <div class="row"><input id="cs3" value="${e(S.cfg.terms.join(", "))}" placeholder="${t("terms")}" aria-label="${t("terms")}"></div><div class="row"><input id="cs4" value="${e(subs().join(", "))}" placeholder="${t("subjs")}" aria-label="${t("subjs")}"><input id="cs5" type="number" min="0" max="100" value="${S.cfg.pass==null?50:S.cfg.pass}" aria-label="${t("passm")}"></div>
 <button onclick="saveCfg()">${t("save")}</button>${msgH()}</div>
 ${adm?`<div class="card"><h2>${t("geo")}</h2>
 <p class="mut">${t("geoNeed")}</p>
 <div class="row"><label><input type="checkbox" id="geoOn" ${S.cfg.geoOn?"checked":""}> ${t("geoOn")}</label></div>
 <div class="row"><input id="geoLat" type="number" step="any" value="${S.cfg.geoLat!=null?S.cfg.geoLat:""}" placeholder="${t("geoLat")}"><input id="geoLng" type="number" step="any" value="${S.cfg.geoLng!=null?S.cfg.geoLng:""}" placeholder="${t("geoLng")}"></div>
 <div class="row"><input id="geoRad" type="number" min="30" max="2000" value="${S.cfg.geoRad||150}" placeholder="${t("geoRad")}"></div>
 <div class="row"><label><input type="checkbox" id="geoWinOn" ${S.cfg.geoWinOn?"checked":""}> ${t("geoWinOn")}</label></div>
 <div class="row"><input id="geoWinFrom" value="${e(S.cfg.geoWinFrom||"07:00")}" placeholder="${t("geoWinFrom")}"><input id="geoWinTo" value="${e(S.cfg.geoWinTo||"17:00")}" placeholder="${t("geoWinTo")}"></div>
 <p class="mut">${t("geoApkOnly")}</p>
 <div class="row"><button onclick="saveGeoCfg()">${t("save")}</button>
 <button class="ghost" onclick="geoSetSchoolHere()">${t("geoSet")}</button>
 <button class="ghost" onclick="geoCheckBtn()">${t("geoCheck")}</button></div>
 ${msgH()}</div>`:""}
 <div class="card"><div class="row"><button onclick="backup()">${t("backup")}</button><label class="fix"><span class="ghost" style="display:inline-block;border:1px solid var(--g);border-radius:6px;padding:9px 14px;font-weight:700;color:var(--g);cursor:pointer">${t("restore")}</span><input type="file" accept=".json,application/json" style="display:none" onchange="restore(this)"></label></div></div>`:"")+pwS();
}
async function saveGeoCfg(){
 S.cfg.geoOn=!!($("geoOn")&&$("geoOn").checked);
 S.cfg.geoWinOn=!!($("geoWinOn")&&$("geoWinOn").checked);
 S.cfg.geoWinFrom=val("geoWinFrom")||"07:00";
 S.cfg.geoWinTo=val("geoWinTo")||"17:00";
 const lat=parseFloat(val("geoLat")),lng=parseFloat(val("geoLng")),rad=Math.max(30,+val("geoRad")||150);
 S.cfg.geoLat=isNaN(lat)?null:lat;S.cfg.geoLng=isNaN(lng)?null:lng;S.cfg.geoRad=rad;
 await savec("cfg");msg=t("saved");draw();
}
async function saveCfg(){
 const terms=val("cs3").split(",").map(x=>x.trim()).filter(Boolean),sj=val("cs4").split(",").map(x=>x.trim()).filter(Boolean);
 S.cfg.school=val("cs1")||S.cfg.school;S.cfg.year=val("cs2");S.cfg.terms=terms.length?terms:S.cfg.terms;S.cfg.subj=sj.length?sj:subs();S.cfg.pass=Math.max(0,Math.min(100,+val("cs5")||0));
 await savec("cfg");msg=t("saved");draw();
}
async function backup(){
 try{const j=MODE==="server"?await api("GET","/backup"):{app:"naleti",v:1,docs:S};dl("naleti-backup-"+day()+".json",JSON.stringify(j))}catch(x){msg=t(x);draw()}
}
function restore(inp){
 const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=async()=>{
  try{
   const j=JSON.parse(r.result);if(j.app!=="naleti"||!j.docs||typeof j.docs!=="object")throw 0;
   const d=norm(j.docs);if(!Array.isArray(d.stu)||!Array.isArray(d.staff)||!Array.isArray(d.tt))throw 0;
   if(!confirm(t("sure")))return;
   if(MODE==="server"){await api("POST","/restore",{docs:j.docs});await loadState()}
   else{const keep={h:S.cfg.adminH,d:S.cfg.adminDef};S=d;if(!S.cfg.adminH){S.cfg.adminH=keep.h;S.cfg.adminDef=keep.d}persist()}
   msg=t("restoreok");draw();
  }catch(x){msg=typeof x==="string"?t(x):t("badfile");draw()}
 };
 r.readAsText(f);
}

/* ---------- start ---------- */
async function boot(){
 if(/^https?:$/.test(location.protocol)){try{const i=await api("GET","/info");MODE="server";S.cfg.school=i.school||S.cfg.school}catch(x){}}
 if(MODE==="local")loadLocal();
 else if(TOK){try{await loadState()}catch(x){TOK="";try{localStorage.removeItem("ntok")}catch(_){}}}
 draw();
}
try{if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(function(){})}}catch(e){}
boot();
</script>
</body>
</html>
